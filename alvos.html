<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Alvos</title>

    <!-- ==========================================
         FIREBASE
    ========================================== -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


    <!-- ==========================================
         ESTILO
    ========================================== -->

    <style>

        *{
            box-sizing:border-box;
        }

        body{

            margin:0;

            font-family:Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #252525,
                    #080808 70%
                );

            color:white;

            min-height:100vh;

        }


        /* ==========================================
           TELA DE LOGIN
        ========================================== */

        #loginTela{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            padding:20px;

        }


        .login-box{

            width:100%;

            max-width:420px;

            background:#151515;

            border:1px solid #333;

            border-radius:12px;

            padding:30px;

            box-shadow:
                0 10px 40px rgba(0,0,0,.6);

            text-align:center;

        }


        .login-box h1{

            margin-top:0;

            margin-bottom:25px;

            letter-spacing:2px;

        }


        input,
        select,
        textarea{

            width:100%;

            padding:13px;

            margin-bottom:12px;

            border-radius:6px;

            border:1px solid #444;

            background:#222;

            color:white;

            outline:none;

        }


        textarea{

            min-height:100px;

            resize:vertical;

        }


        button{

            border:none;

            border-radius:6px;

            padding:12px 18px;

            cursor:pointer;

            font-weight:bold;

        }


        .btn-principal{

            width:100%;

            background:#b00000;

            color:white;

        }


        .btn-principal:hover{

            background:#d00000;

        }


        /* ==========================================
           SISTEMA
        ========================================== */

        #sistema{

            display:none;

            min-height:100vh;

            padding:25px;

        }


        .topo{

            max-width:1200px;

            margin:auto;

            display:flex;

            justify-content:space-between;

            align-items:center;

            gap:15px;

            margin-bottom:25px;

        }


        .topo h1{

            margin:0;

            letter-spacing:2px;

        }


        .btn-sair{

            background:#333;

            color:white;

        }


        .btn-sair:hover{

            background:#555;

        }


        .container{

            max-width:1200px;

            margin:auto;

        }


        /* ==========================================
           PAINEL
        ========================================== */

        .painel{

            background:#151515;

            border:1px solid #333;

            border-radius:10px;

            padding:20px;

            margin-bottom:25px;

        }


        .painel h2{

            margin-top:0;

            border-bottom:1px solid #333;

            padding-bottom:12px;

        }


        /* ==========================================
           ALVOS
        ========================================== */

        .alvos-grid{

            display:grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(260px,1fr)
                );

            gap:18px;

        }


        .alvo-card{

            background:#202020;

            border:1px solid #383838;

            border-radius:10px;

            padding:18px;

            transition:.2s;

        }


        .alvo-card:hover{

            transform:translateY(-2px);

            border-color:#666;

        }


        .alvo-card h3{

            margin-top:0;

            margin-bottom:8px;

        }


        .status{

            display:inline-block;

            padding:5px 9px;

            border-radius:5px;

            font-size:12px;

            font-weight:bold;

            margin-bottom:12px;

        }


        .ativo{

            background:#155d15;

            color:#b9ffb9;

        }


        .inativo{

            background:#5d1515;

            color:#ffb9b9;

        }


        .recompensa{

            font-size:20px;

            font-weight:bold;

            margin:12px 0;

        }


        .btn{

            width:100%;

            margin-top:8px;

            color:white;

        }


        .btn-verde{

            background:#176b17;

        }


        .btn-verde:hover{

            background:#208b20;

        }


        .btn-amarelo{

            background:#806700;

        }


        .btn-amarelo:hover{

            background:#a88700;

        }


        .btn-vermelho{

            background:#8b1515;

        }


        .btn-vermelho:hover{

            background:#b51c1c;

        }


        .btn-cinza{

            background:#444;

        }


        /* ==========================================
           CONTRATOS
        ========================================== */

        .contrato{

            background:#202020;

            border:1px solid #383838;

            border-radius:10px;

            padding:18px;

            margin-bottom:15px;

        }


        .contrato h3{

            margin-top:0;

        }


        .contrato-info{

            line-height:1.6;

            color:#ddd;

        }


        .contrato-preparando{

            border-color:#806700;

        }


        .contrato-aceito{

            border-color:#176b17;

        }


        /* ==========================================
           MODAL
        ========================================== */

        .modal{

            display:none;

            position:fixed;

            inset:0;

            background:rgba(0,0,0,.8);

            justify-content:center;

            align-items:center;

            padding:20px;

            z-index:999;

        }


        .modal-conteudo{

            width:100%;

            max-width:700px;

            max-height:90vh;

            overflow-y:auto;

            background:#151515;

            border:1px solid #444;

            border-radius:12px;

            padding:25px;

        }


        .modal-topo{

            display:flex;

            justify-content:space-between;

            align-items:center;

            gap:10px;

        }


        .fechar{

            background:#333;

            color:white;

            font-size:20px;

            padding:7px 12px;

        }


        .bloco-info{

            background:#202020;

            border:1px solid #383838;

            border-radius:8px;

            padding:15px;

            margin:15px 0;

        }


        .bloqueado{

            color:#999;

            text-align:center;

            padding:20px;

        }


        .local{

            background:#252525;

            border-radius:6px;

            padding:10px;

            margin:7px 0;

        }


        /* ==========================================
           RESPONSIVO
        ========================================== */

        @media(max-width:600px){

            #sistema{

                padding:15px;

            }

            .topo{

                flex-direction:column;

                align-items:stretch;

            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     LOGIN
========================================== -->

<div id="loginTela">

    <div class="login-box">

        <h1>ALVOS</h1>

        <p>Entre para acessar o sistema.</p>

        <input
            type="text"
            id="usuarioLogin"
            placeholder="Usuário"
        >

        <input
            type="password"
            id="senhaLogin"
            placeholder="Senha"
        >

        <button
            class="btn-principal"
            onclick="login()"
        >
            ENTRAR
        </button>

    </div>

</div>



<!-- ==========================================
     SISTEMA
========================================== -->

<div id="sistema">


    <div class="topo">

        <h1>ALVOS</h1>

        <button
            class="btn-sair"
            onclick="sair()"
        >
            SAIR
        </button>

    </div>


    <div class="container">


        <!-- ==========================================
             PAINEL ADMIN
        ========================================== -->

        <div
            class="painel"
            id="painelAdmin"
            style="display:none;"
        >

            <h2>GERENCIAR ALVOS</h2>


            <input
                type="hidden"
                id="alvoEditando"
            >


            <input
                type="text"
                id="nomeAlvo"
                placeholder="Nome do alvo"
            >


            <input
                type="number"
                id="idadeAlvo"
                placeholder="Idade"
            >


            <input
                type="text"
                id="profissaoAlvo"
                placeholder="Profissão"
            >


            <input
                type="text"
                id="nacionalidadeAlvo"
                placeholder="Nacionalidade"
            >


            <input
                type="text"
                id="residenciaAlvo"
                placeholder="Residência"
            >


            <select id="ameacaAlvo">

                <option value="Baixa">
                    Ameaça: Baixa
                </option>

                <option value="Média">
                    Ameaça: Média
                </option>

                <option value="Alta">
                    Ameaça: Alta
                </option>

            </select>


            <textarea
                id="descricaoAlvo"
                placeholder="Descrição"
            ></textarea>


            <textarea
                id="informacaoAlvo"
                placeholder="Informações importantes"
            ></textarea>


            <textarea
                id="personalidadeAlvo"
                placeholder="Personalidade"
            ></textarea>


            <textarea
                id="equipamentoAlvo"
                placeholder="Equipamentos"
            ></textarea>


            <textarea
                id="locaisAlvo"
                placeholder="Locais do alvo. Coloque um por linha."
            ></textarea>


            <input
                type="number"
                id="recompensaAlvo"
                placeholder="Recompensa"
            >


            <input
                type="text"
                id="objetivoAlvo"
                placeholder="Objetivo"
            >


            <button
                class="btn btn-verde"
                onclick="salvarAlvo()"
            >
                SALVAR ALVO
            </button>


            <button
                class="btn btn-cinza"
                id="btnCancelarEdicao"
                onclick="cancelarEdicao()"
                style="display:none;"
            >
                CANCELAR EDIÇÃO
            </button>


            <div
                id="listaAlvosAdmin"
                style="margin-top:25px;"
            ></div>

        </div>



        <!-- ==========================================
             ALVOS DISPONÍVEIS
        ========================================== -->

        <div class="painel">

            <h2>ALVOS DISPONÍVEIS</h2>

            <div
                id="listaAlvos"
                class="alvos-grid"
            ></div>

        </div>



        <!-- ==========================================
             MEUS CONTRATOS
        ========================================== -->

        <div class="painel">

            <h2>MEUS CONTRATOS</h2>

            <div id="meusContratos"></div>

        </div>



        <!-- ==========================================
             CONTRATOS DOS JOGADORES
        ========================================== -->

        <div
            class="painel"
            id="painelContratosAdmin"
            style="display:none;"
        >

            <h2>CONTRATOS DOS JOGADORES</h2>

            <div id="contratosAdmin"></div>

        </div>


    </div>

</div>



<!-- ==========================================
     MODAL DO CONTRATO
========================================== -->

<div
    class="modal"
    id="modalContrato"
>

    <div class="modal-conteudo">


        <div class="modal-topo">

            <h2 id="modalTitulo">
                CONTRATO
            </h2>

            <button
                class="fechar"
                onclick="fecharModal()"
            >
                ×
            </button>

        </div>


        <div id="modalCorpo"></div>


    </div>

</div>



<script>


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

    apiKey: "COLOQUE_SEU_API_KEY",

    authDomain:
        "gta-rpg.firebaseapp.com",

    databaseURL:
        "https://gta-rpg-default-rtdb.firebaseio.com",

    projectId:
        "gta-rpg",

    storageBucket:
        "gta-rpg.firebasestorage.app",

    messagingSenderId:
        "COLOQUE_SEU_MESSAGING_SENDER_ID",

    appId:
        "COLOQUE_SEU_APP_ID"

};


firebase.initializeApp(
    firebaseConfig
);


const db =
    firebase.database();



/* ==========================================
   USUÁRIOS
========================================== */

const usuarios = {

    Kaius:"28/09",

    Gaby:"22/09",

    Duda:"13/09",

    Italo:"1822"

};



let usuarioAtual = null;

let alvoAtual = null;



/* ==========================================
   LOGIN
========================================== */

function login(){

    const usuario =
        document
        .getElementById("usuarioLogin")
        .value
        .trim();


    const senha =
        document
        .getElementById("senhaLogin")
        .value
        .trim();


    if(
        usuarios[usuario] &&
        usuarios[usuario] === senha
    ){

        usuarioAtual =
            usuario;


        localStorage.setItem(
            "alvos_usuario",
            usuario
        );


        abrirSistema();

    }else{

        alert(
            "Usuário ou senha incorretos."
        );

    }

}



/* ==========================================
   ABRIR SISTEMA
========================================== */

function abrirSistema(){

    document
        .getElementById("loginTela")
        .style.display = "none";


    document
        .getElementById("sistema")
        .style.display = "block";


    if(
        usuarioAtual === "Italo"
    ){

        document
            .getElementById("painelAdmin")
            .style.display = "block";


        document
            .getElementById("painelContratosAdmin")
            .style.display = "block";

    }


    observarAlvos();

    observarMeusContratos();


    if(
        usuarioAtual === "Italo"
    ){

        observarContratos();

        observarAdmin();

    }

}



/* ==========================================
   SAIR
========================================== */

function sair(){

    localStorage.removeItem(
        "alvos_usuario"
    );

    usuarioAtual = null;

    location.reload();

}



/* ==========================================
   SALVAR ALVO
========================================== */

async function salvarAlvo(){

    if(
        usuarioAtual !== "Italo"
    ){

        alert(
            "Somente o administrador pode cadastrar alvos."
        );

        return;

    }


    const idEditando =
        document
        .getElementById("alvoEditando")
        .value;


    const nome =
        document
        .getElementById("nomeAlvo")
        .value
        .trim();


    const idade =
        document
        .getElementById("idadeAlvo")
        .value;


    const profissao =
        document
        .getElementById("profissaoAlvo")
        .value
        .trim();


    const nacionalidade =
        document
        .getElementById("nacionalidadeAlvo")
        .value
        .trim();


    const residencia =
        document
        .getElementById("residenciaAlvo")
        .value
        .trim();


    const ameaca =
        document
        .getElementById("ameacaAlvo")
        .value;


    const descricao =
        document
        .getElementById("descricaoAlvo")
        .value
        .trim();


    const informacao =
        document
        .getElementById("informacaoAlvo")
        .value
        .trim();


    const personalidade =
        document
        .getElementById("personalidadeAlvo")
        .value
        .trim();


    const equipamento =
        document
        .getElementById("equipamentoAlvo")
        .value
        .trim();


    const locaisTexto =
        document
        .getElementById("locaisAlvo")
        .value
        .trim();


    const recompensa =
        Number(
            document
            .getElementById("recompensaAlvo")
            .value
        );


    const objetivo =
        document
        .getElementById("objetivoAlvo")
        .value
        .trim();


    if(!nome){

        alert(
            "Informe o nome do alvo."
        );

        return;

    }


    const locais =
        locaisTexto
        .split("\n")
        .map(
            item => item.trim()
        )
        .filter(
            item => item
        );


    const dados = {

        nome,

        idade,

        profissao,

        nacionalidade,

        residencia,

        ameaca,

        descricao,

        informacao,

        personalidade,

        equipamento,

        locais,

        recompensa,

        objetivo,

        ativo:true,

        atualizadoEm:
            Date.now()

    };


    try{

        if(idEditando){

            await db.ref(
                "alvos/" + idEditando
            ).update(
                dados
            );

            alert(
                "Alvo atualizado."
            );

        }else{

            dados.criadoEm =
                Date.now();

            await db
                .ref("alvos")
                .push(dados);

            alert(
                "Alvo criado."
            );

        }


        limparFormulario();

    }

    catch(erro){

        console.error(erro);

        alert(
            "Não foi possível salvar o alvo."
        );

    }

}



/* ==========================================
   LIMPAR FORMULÁRIO
========================================== */

function limparFormulario(){

    document
        .getElementById("alvoEditando")
        .value = "";


    document
        .getElementById("nomeAlvo")
        .value = "";


    document
        .getElementById("idadeAlvo")
        .value = "";


    document
        .getElementById("profissaoAlvo")
        .value = "";


    document
        .getElementById("nacionalidadeAlvo")
        .value = "";


    document
        .getElementById("residenciaAlvo")
        .value = "";


    document
        .getElementById("ameacaAlvo")
        .value = "Baixa";


    document
        .getElementById("descricaoAlvo")
        .value = "";


    document
        .getElementById("informacaoAlvo")
        .value = "";


    document
        .getElementById("personalidadeAlvo")
        .value = "";


    document
        .getElementById("equipamentoAlvo")
        .value = "";


    document
        .getElementById("locaisAlvo")
        .value = "";


    document
        .getElementById("recompensaAlvo")
        .value = "";


    document
        .getElementById("objetivoAlvo")
        .value = "";


    document
        .getElementById("btnCancelarEdicao")
        .style.display = "none";

}



/* ==========================================
   OBSERVAR ALVOS
========================================== */

function observarAlvos(){

    db.ref("alvos")
    .on(
        "value",
        snapshot => {

            const lista =
                document
                .getElementById("listaAlvos");


            lista.innerHTML = "";


            if(!snapshot.exists()){

                lista.innerHTML =
                    "<p>Nenhum alvo cadastrado.</p>";

                return;

            }


            snapshot.forEach(
                item => {

                    const alvo =
                        item.val();


                    const id =
                        item.key;


                    if(
                        alvo.ativo === false &&
                        usuarioAtual !== "Italo"
                    ){

                        return;

                    }


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "alvo-card";


                    const status =
                        alvo.ativo === false

                        ? `
                            <span class="status inativo">
                                INATIVO
                            </span>
                          `

                        : `
                            <span class="status ativo">
                                ATIVO
                            </span>
                          `;


                    card.innerHTML = `

                        ${status}

                        <h3>
                            ${alvo.nome || "Sem nome"}
                        </h3>

                        <p>
                            ${alvo.profissao || ""}
                        </p>

                        <div class="recompensa">
                            $${Number(
                                alvo.recompensa || 0
                            ).toLocaleString(
                                "pt-BR"
                            )}
                        </div>

                        <button
                            class="btn btn-verde"
                            onclick="
                                abrirContrato('${id}')
                            "
                        >
                            VER CONTRATO
                        </button>

                    `;


                    lista.appendChild(
                        card
                    );

                }
            );

        }
    );

}



/* ==========================================
   ABRIR CONTRATO
========================================== */

function abrirContrato(id){

    db.ref(
        "alvos/" + id
    )
    .once(
        "value",
        snapshot => {

            if(!snapshot.exists()){

                alert(
                    "Alvo não encontrado."
                );

                return;

            }


            alvoAtual = {

                id,

                ...snapshot.val()

            };


            atualizarModal();

            document
                .getElementById("modalContrato")
                .style.display = "flex";

        }
    );

}



/* ==========================================
   ATUALIZAR MODAL
========================================== */

function atualizarModal(){

    if(!alvoAtual){
        return;
    }


    document
        .getElementById("modalTitulo")
        .innerText =
        "CONTRATO — " +
        alvoAtual.nome;


    const recompensa =
        Number(
            alvoAtual.recompensa || 0
        );


    const contratoRef =
        db.ref("contratos");


    contratoRef
        .orderByChild("jogadorAlvo")
        .equalTo(
            usuarioAtual +
            "_" +
            alvoAtual.id
        )
        .once(
            "value",
            snapshot => {

                let contrato = null;


                snapshot.forEach(
                    item => {

                        contrato = {

                            id:item.key,

                            ...item.val()

                        };

                    }
                );


                if(!contrato){

                    mostrarContratoCompleto(
                        recompensa
                    );

                    return;

                }


                const recompensaAtual =
                    Number(
                        contrato.recompensaFinal ||
                        recompensa
                    );


                mostrarContratoComEstado(
                    contrato,
                    recompensaAtual
                );

            }
        );

}



/* ==========================================
   CONTRATO COMPLETO
========================================== */

function mostrarContratoCompleto(
    recompensa
){

    document
        .getElementById("modalCorpo")
        .innerHTML = `

            <div class="bloco-info">

                <strong>
                    ALVO
                </strong>

                <p>
                    ${alvoAtual.nome}
                </p>

                <p>
                    Idade:
                    ${alvoAtual.idade || "-"}
                </p>

                <p>
                    Profissão:
                    ${alvoAtual.profissao || "-"}
                </p>

                <p>
                    Residência:
                    ${alvoAtual.residencia || "-"}
                </p>

                <p>
                    Ameaça:
                    ${alvoAtual.ameaca || "-"}
                </p>

            </div>


            <div class="bloco-info">

                <strong>
                    RECOMPENSA
                </strong>

                <div class="recompensa">
                    $${recompensa.toLocaleString(
                        "pt-BR"
                    )}
                </div>

            </div>


            <button
                class="btn btn-verde"
                onclick="aceitarContrato()"
            >
                ACEITAR CONTRATO
            </button>

        `;

}



/* ==========================================
   CONTRATO COM ESTADO
========================================== */

function mostrarContratoComEstado(
    contrato,
    recompensa
){

    let desconto = 0;


    if(
        contrato.informacaoRevelada
    ){

        desconto += 25;

    }


    if(
        contrato.locaisRevelados
    ){

        desconto += 25;

    }


    document
        .getElementById("modalCorpo")
        .innerHTML = `

            <div class="bloco-info">

                <strong>
                    ALVO
                </strong>

                <p>
                    ${alvoAtual.nome}
                </p>

                <p>
                    Idade:
                    ${alvoAtual.idade || "-"}
                </p>

                <p>
                    Profissão:
                    ${alvoAtual.profissao || "-"}
                </p>

            </div>


            <div class="bloco-info">

                <strong>
                    INFORMAÇÕES
                </strong>

                ${
                    contrato.informacaoRevelada

                    ?

                    `
                        <p>
                            ${alvoAtual.informacao || "Sem informação."}
                        </p>
                    `

                    :

                    `
                        <div class="bloqueado">
                            🔒 Informações bloqueadas
                        </div>

                        <button
                            class="btn btn-amarelo"
                            onclick="
                                revelarInformacao()
                            "
                        >
                            REVELAR INFORMAÇÕES
                        </button>
                    `
                }

            </div>


            <div class="bloco-info">

                <strong>
                    LOCAIS
                </strong>

                ${
                    contrato.locaisRevelados

                    ?

                    `
                        ${
                            (alvoAtual.locais || [])
                            .map(
                                local => `
                                    <div class="local">
                                        ${local}
                                    </div>
                                `
                            )
                            .join("")
                        }
                    `

                    :

                    `
                        <div class="bloqueado">
                            🔒 Locais bloqueados
                        </div>

                        <button
                            class="btn btn-amarelo"
                            onclick="
                                revelarLocais()
                            "
                        >
                            REVELAR LOCAIS
                        </button>
                    `
                }

            </div>


            <div class="bloco-info">

                <strong>
                    RECOMPENSA ATUAL
                </strong>

                <div class="recompensa">

                    $${recompensa.toLocaleString(
                        "pt-BR"
                    )}

                </div>

            </div>


            ${
                contrato.status !== "Aceito"

                ?

                `
                    <button
                        class="btn btn-verde"
                        onclick="
                            aceitarContrato()
                        "
                    >
                        ACEITAR CONTRATO
                    </button>
                `

                :

                `
                    <div class="bloco-info">

                        <strong>
                            STATUS
                        </strong>

                        <p>
                            CONTRATO ACEITO
                        </p>

                    </div>
                `
            }

        `;

}



/* ==========================================
   REVELAR INFORMAÇÃO
========================================== */

async function revelarInformacao(){

    if(!alvoAtual){
        return;
    }


    const chave =
        usuarioAtual +
        "_" +
        alvoAtual.id;


    const referencia =
        db.ref("contratos");


    const snapshot =
        await referencia
        .orderByChild("jogadorAlvo")
        .equalTo(chave)
        .once("value");


    let contratoId = null;

    let contrato = null;


    snapshot.forEach(
        item => {

            contratoId =
                item.key;

            contrato =
                item.val();

        }
    );


    const recompensa =
        calcularRecompensaBanco(
            true,
            contrato
                ? contrato.locaisRevelados
                : false,
            alvoAtual.recompensa
        );


    if(contratoId){

        await db.ref(
            "contratos/" +
            contratoId
        )
        .update({

            informacaoRevelada:true,

            recompensaFinal:
                recompensa

        });

    }else{

        await db
            .ref("contratos")
            .push({

                jogador:
                    usuarioAtual,

                jogadorAlvo:
                    chave,

                alvoId:
                    alvoAtual.id,

                alvoNome:
                    alvoAtual.nome,

                recompensaOriginal:
                    Number(
                        alvoAtual.recompensa || 0
                    ),

                informacaoRevelada:true,

                locaisRevelados:false,

                recompensaFinal:
                    recompensa,

                status:
                    "Preparando",

                criadoEm:
                    Date.now()

            });

    }


    atualizarModal();

}

/* ==========================================
   CALCULAR RECOMPENSA
========================================== */

function calcularRecompensaBanco(

    informacao,

    locais,

    recompensaOriginal

){

    let recompensa =
        Number(
            recompensaOriginal || 0
        );


    if(informacao){

        recompensa *= .75;

    }


    if(locais){

        recompensa *= .75;

    }


    return Math.round(
        recompensa
    );

}

/* ==========================================
   EXCLUIR CONTRATO — ADMIN
========================================== */

async function excluirContrato(id){

    if(
        usuarioAtual !== "Italo"
    ){

        alert(
            "Somente o administrador pode excluir contratos."
        );

        return;

    }


    const confirmar =
        confirm(

            "EXCLUIR CONTRATO?\n\n" +

            "O contrato será removido " +
            "permanentemente do sistema.\n\n" +

            "Essa ação não pode ser desfeita."

        );


    if(!confirmar){

        return;

    }


    try{

        const referencia =
            db.ref(
                "contratos/" + id
            );


        await referencia.remove();


        /*
         * CONFIRMAÇÃO REAL NO FIREBASE
         */

        const verificar =
            await referencia.once(
                "value"
            );


        if(
            verificar.exists()
        ){

            alert(

                "O Firebase não permitiu " +
                "a exclusão do contrato."

            );

            console.error(
                "Contrato ainda existe no Firebase."
            );

            return;

        }


        alert(
            "Contrato excluído com sucesso."
        );

    }

    catch(erro){

        console.error(
            "ERRO AO EXCLUIR:",
            erro
        );


        alert(

            "Não foi possível excluir o contrato.\n\n" +

            "Provavelmente as Rules do Firebase " +
            "estão bloqueando a exclusão."

        );

    }

}

/* ==========================================
   EDITAR ALVO
========================================== */

function editarAlvo(id){

    db.ref(
        "alvos/" + id
    )
    .once(
        "value",
        snapshot => {

            if(!snapshot.exists()){
                return;
            }


            const alvo =
                snapshot.val();


            document
                .getElementById("alvoEditando")
                .value = id;


            document
                .getElementById("nomeAlvo")
                .value =
                alvo.nome || "";


            document
                .getElementById("idadeAlvo")
                .value =
                alvo.idade || "";


            document
                .getElementById("profissaoAlvo")
                .value =
                alvo.profissao || "";


            document
                .getElementById("nacionalidadeAlvo")
                .value =
                alvo.nacionalidade || "";


            document
                .getElementById("residenciaAlvo")
                .value =
                alvo.residencia || "";


            document
                .getElementById("ameacaAlvo")
                .value =
                alvo.ameaca || "Baixa";


            document
                .getElementById("descricaoAlvo")
                .value =
                alvo.descricao || "";


            document
                .getElementById("informacaoAlvo")
                .value =
                alvo.informacao || "";


            document
                .getElementById("personalidadeAlvo")
                .value =
                alvo.personalidade || "";


            document
                .getElementById("equipamentoAlvo")
                .value =
                alvo.equipamento || "";


            document
                .getElementById("locaisAlvo")
                .value =
                (alvo.locais || [])
                .join("\n");


            document
                .getElementById("recompensaAlvo")
                .value =
                alvo.recompensa || "";


            document
                .getElementById("objetivoAlvo")
                .value =
                alvo.objetivo || "";


            document
                .getElementById(
                    "btnCancelarEdicao"
                )
                .style.display = "block";

        }
    );

}

}



/* ==========================================
   ATIVAR / DESATIVAR ALVO
========================================== */

async function alternarAlvo(id){

    if(
        usuarioAtual !== "Italo"
    ){

        return;

    }


    const snapshot =
        await db.ref(
            "alvos/" + id
        ).once("value");


    if(!snapshot.exists()){
        return;
    }


    const alvo =
        snapshot.val();


    await db.ref(
        "alvos/" + id
    ).update({

        ativo:
            alvo.ativo === false

            ? true

            : false

    });

}



/* ==========================================
   FECHAR MODAL
========================================== */

function fecharModal(){

    document
        .getElementById(
            "modalContrato"
        )
        .style.display = "none";


    alvoAtual = null;

}



/* ==========================================
   FECHAR MODAL CLICANDO FORA
========================================== */

document
    .getElementById(
        "modalContrato"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target === this
            ){

                fecharModal();

            }

        }
    );

if(
