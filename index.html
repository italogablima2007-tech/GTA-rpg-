<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Central do RPG</title>

    <!-- ==========================================
         FIREBASE
    =========================================== -->

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>


    <!-- ==========================================
         ESTILO
    =========================================== -->

    <style>

        *{
            box-sizing:border-box;
        }

        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#101010;
            color:white;
            min-height:100vh;
        }

        button,
        input,
        textarea,
        select{
            font-family:inherit;
        }


        /* ==========================================
           CENTRAL
        =========================================== */

        #central{
            min-height:100vh;
            padding:50px 25px;
            display:flex;
            flex-direction:column;
            align-items:center;
        }

        .titulo{
            font-size:42px;
            font-weight:bold;
            letter-spacing:4px;
            margin-bottom:10px;
            text-align:center;
        }

        .subtitulo{
            color:#999;
            margin-bottom:45px;
            text-align:center;
        }


        /* ==========================================
           ABAS
        =========================================== */

        .abas-central{
            width:100%;
            max-width:1200px;
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:25px;
        }

        .aba{
            height:220px;
            border:2px solid #333;
            border-radius:12px;
            overflow:hidden;
            display:flex;
            align-items:flex-end;
            justify-content:center;
            cursor:pointer;
            transition:.25s;
            position:relative;
            background-size:cover;
            background-position:center;
        }

        .aba:hover{
            transform:translateY(-5px);
            border-color:#fff;
        }

        .aba h2{
            width:100%;
            margin:0;
            padding:25px 10px;
            text-align:center;
            font-size:24px;
            letter-spacing:2px;
            background:linear-gradient(
                transparent,
                rgba(0,0,0,.95)
            );
        }


        /* ==========================================
           IMÓVEIS
        =========================================== */

        .aba-imoveis{
            background:
                linear-gradient(
                    rgba(0,0,0,.30),
                    rgba(0,0,0,.75)
                ),
                url("./imoveis.jpg");

            background-size:cover;
            background-position:center;
        }


        /* ==========================================
           LESTER
        =========================================== */

        .aba-lester{
            background:
                linear-gradient(
                    rgba(0,0,0,.30),
                    rgba(0,0,0,.75)
                ),
                url("./lester.jpg");

            background-size:cover;
            background-position:center;
        }


        /* ==========================================
           ALVOS
        =========================================== */

        .aba-alvos{
            background:
                linear-gradient(
                    rgba(0,0,0,.30),
                    rgba(0,0,0,.75)
                ),
                url("./alvos.jpg");

            background-size:cover;
            background-position:center;
        }


        /* ==========================================
           HACKER
           
           IMPORTANTE:
           A ABA FICA SEMPRE VISÍVEL.
           NÃO EXISTE VERIFICAÇÃO DE ACESSO AQUI.
        =========================================== */

        .aba-hacker{
            background:
                linear-gradient(
                    rgba(0,0,0,.30),
                    rgba(0,0,0,.70)
                ),
                url("./hacker.jpg");

            background-size:cover;
            background-position:center;
        }

        .aba-hacker:hover{
            border-color:#00ff88;
        }


        /* ==========================================
           LOGIN LESTER
        =========================================== */

        #login{
            display:none;
            min-height:100vh;
            align-items:center;
            justify-content:center;
            padding:25px;
        }

        .login-box{
            width:100%;
            max-width:400px;
            background:#181818;
            border:1px solid #333;
            border-radius:12px;
            padding:30px;
            box-shadow:0 10px 40px rgba(0,0,0,.5);
        }

        .login-box h2{
            text-align:center;
            margin-top:0;
            margin-bottom:25px;
        }

        .campo{
            margin-bottom:15px;
        }

        .campo label{
            display:block;
            margin-bottom:7px;
            color:#aaa;
            font-size:14px;
        }

        .campo input,
        .campo textarea,
        .campo select{
            width:100%;
            padding:12px;
            background:#101010;
            color:white;
            border:1px solid #444;
            border-radius:6px;
            outline:none;
        }

        .campo textarea{
            min-height:100px;
            resize:vertical;
        }

        .campo input:focus,
        .campo textarea:focus,
        .campo select:focus{
            border-color:#777;
        }

        .btn{
            width:100%;
            padding:12px;
            border:0;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
            background:#fff;
            color:#000;
            transition:.2s;
        }

        .btn:hover{
            opacity:.85;
        }

        .btn-voltar{
            margin-top:10px;
            background:#292929;
            color:white;
        }

        .erro{
            color:#ff4444;
            text-align:center;
            margin-top:15px;
            min-height:20px;
        }


        /* ==========================================
           ÁREA LESTER
        =========================================== */

        #lester{
            display:none;
            min-height:100vh;
            padding:25px;
        }

        .lester-container{
            width:100%;
            max-width:1200px;
            margin:auto;
        }

        .lester-topo{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:20px;
            padding:20px;
            background:#181818;
            border:1px solid #333;
            border-radius:10px;
            margin-bottom:25px;
        }

        .lester-info h2{
            margin:0 0 5px;
        }

        .saldo{
            color:#00ff88;
            font-size:20px;
            font-weight:bold;
        }

        .btn-sair{
            width:auto;
            padding:10px 20px;
            background:#8b0000;
            color:white;
        }


        /* ==========================================
           ABAS DO LESTER
        =========================================== */

        .lester-tabs{
            display:flex;
            gap:10px;
            margin-bottom:25px;
            flex-wrap:wrap;
        }

        .lester-tab{
            padding:12px 20px;
            background:#222;
            border:1px solid #444;
            color:white;
            border-radius:6px;
            cursor:pointer;
        }

        .lester-tab.ativo{
            background:#fff;
            color:#000;
        }

        .lester-painel{
            display:none;
        }

        .lester-painel.ativo{
            display:block;
        }


        /* ==========================================
           MISSÕES
        =========================================== */

        .missao{
            background:#181818;
            border:1px solid #333;
            border-radius:10px;
            padding:20px;
            margin-bottom:15px;
        }

        .missao h3{
            margin-top:0;
            margin-bottom:10px;
        }

        .missao p{
            color:#bbb;
            line-height:1.5;
        }

        .missao-info{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:10px;
            margin:15px 0;
        }

        .info-box{
            background:#101010;
            padding:12px;
            border-radius:6px;
            border:1px solid #292929;
        }

        .info-box small{
            display:block;
            color:#777;
            margin-bottom:5px;
        }

        .recompensa{
            color:#00ff88;
            font-weight:bold;
        }

        .tempo{
            color:#ffd000;
            font-weight:bold;
        }

        .acoes{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .acoes button{
            width:auto;
            padding:10px 18px;
        }

        .btn-aceitar{
            background:#00a86b;
            color:white;
        }

        .btn-cancelar{
            background:#8b0000;
            color:white;
        }


        /* ==========================================
           ADMIN
        =========================================== */

        .admin-box{
            background:#181818;
            border:1px solid #333;
            border-radius:10px;
            padding:20px;
            margin-bottom:25px;
        }

        .admin-box h3{
            margin-top:0;
        }

        .form-grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:15px;
        }

        .form-grid .campo-full{
            grid-column:1 / -1;
        }

        .admin-missao{
            border:1px solid #333;
            padding:15px;
            border-radius:8px;
            margin-top:10px;
            background:#111;
        }

        .admin-missao-header{
            display:flex;
            justify-content:space-between;
            gap:10px;
            align-items:center;
        }

        .btn-excluir{
            width:auto;
            background:#8b0000;
            color:white;
            padding:8px 14px;
        }


        /* ==========================================
           SALDOS
        =========================================== */

        .saldo-jogador{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
            padding:15px;
            background:#111;
            border:1px solid #333;
            border-radius:8px;
            margin-bottom:10px;
        }

        .saldo-acoes{
            display:flex;
            gap:5px;
            flex-wrap:wrap;
        }

        .saldo-acoes button{
            width:auto;
            padding:7px 10px;
        }

        .mais{
            background:#006b45;
            color:white;
        }

        .menos{
            background:#8b0000;
            color:white;
        }


        /* ==========================================
           MENSAGEM
        =========================================== */

        #mensagem{
            position:fixed;
            bottom:25px;
            right:25px;
            background:#222;
            color:white;
            padding:15px 20px;
            border-radius:8px;
            border:1px solid #444;
            display:none;
            z-index:9999;
            box-shadow:0 5px 20px rgba(0,0,0,.5);
        }


        /* ==========================================
           RESPONSIVO
        =========================================== */

        @media(max-width:900px){

            .abas-central{
                grid-template-columns:repeat(2,1fr);
            }

            .missao-info{
                grid-template-columns:1fr;
            }

        }

        @media(max-width:700px){

            .abas-central{
                grid-template-columns:1fr;
            }

            .aba{
                height:180px;
            }

            .titulo{
                font-size:30px;
            }

            .lester-topo{
                flex-direction:column;
                align-items:flex-start;
            }

            .form-grid{
                grid-template-columns:1fr;
            }

            .form-grid .campo-full{
                grid-column:auto;
            }

            .saldo-jogador{
                flex-direction:column;
                align-items:flex-start;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================================
         CENTRAL
    =========================================== -->

    <section id="central">

        <div class="titulo">
            CENTRAL DO RPG
        </div>

        <div class="subtitulo">
            Sistema principal
        </div>


        <div class="abas-central">


            <!-- IMÓVEIS -->

            <div
                class="aba aba-imoveis"
                onclick="abrirImoveis()"
            >

                <h2>
                    IMÓVEIS
                </h2>

            </div>


            <!-- MISSÕES DO LESTER -->

            <div
                class="aba aba-lester"
                onclick="abrirLogin()"
            >

                <h2>
                    MISSÕES DO LESTER
                </h2>

            </div>


            <!-- ALVOS -->

            <div
                class="aba aba-alvos"
                onclick="abrirAlvos()"
            >

                <h2>
                    ALVOS
                </h2>

            </div>


            <!-- HACKER -->

            <!--
                IMPORTANTE:

                ESTA ABA FICA DISPONÍVEL PARA TODOS.

                NÃO EXISTE:
                - verificarAcessoHacker()
                - esconder aba
                - liberar aba por jogador

                O controle de autorização fica no hacker.html.
            -->

            <div
                id="abaHacker"
                class="aba aba-hacker"
                onclick="abrirHacker()"
            >

                <h2>
                    HACKER
                </h2>

            </div>


        </div>

    </section>



    <!-- ==========================================
         LOGIN LESTER
    =========================================== -->

    <section id="login">

        <div class="login-box">

            <h2>
                LOGIN
            </h2>

            <div class="campo">

                <label>
                    Usuário
                </label>

                <input
                    type="text"
                    id="loginUsuario"
                    placeholder="Digite seu nome"
                >

            </div>


            <div class="campo">

                <label>
                    Senha
                </label>

                <input
                    type="password"
                    id="loginSenha"
                    placeholder="Digite sua senha"
                >

            </div>


            <button
                class="btn"
                onclick="fazerLogin()"
            >
                ENTRAR
            </button>


            <button
                class="btn btn-voltar"
                onclick="voltarCentral()"
            >
                VOLTAR
            </button>


            <div
                id="erroLogin"
                class="erro"
            ></div>

        </div>

    </section>



    <!-- ==========================================
         ÁREA DO LESTER
    =========================================== -->

    <section id="lester">

        <div class="lester-container">


            <!-- CABEÇALHO -->

            <div class="lester-topo">

                <div class="lester-info">

                    <h2>
                        MISSÕES DO LESTER
                    </h2>

                    <div>
                        Jogador:
                        <strong id="nomeUsuario">
                            -
                        </strong>
                    </div>

                    <div class="saldo">
                        $
                        <span id="saldoUsuario">
                            0
                        </span>
                    </div>

                </div>


                <button
                    class="btn btn-sair"
                    onclick="sairLester()"
                >
                    SAIR
                </button>

            </div>



            <!-- ABAS -->

            <div class="lester-tabs">

                <button
                    class="lester-tab ativo"
                    onclick="abrirPainel('missoes', this)"
                >
                    MISSÕES
                </button>


                <button
                    id="botaoAdmin"
                    class="lester-tab"
                    onclick="abrirPainel('admin', this)"
                    style="display:none;"
                >
                    ADMINISTRADOR
                </button>

            </div>



            <!-- ==========================================
                 PAINEL MISSÕES
            =========================================== -->

            <div
                id="painelMissoes"
                class="lester-painel ativo"
            >

                <div id="listaMissoes">

                    <p>
                        Carregando missões...
                    </p>

                </div>

            </div>



            <!-- ==========================================
                 PAINEL ADMIN
            =========================================== -->

            <div
                id="painelAdmin"
                class="lester-painel"
            >


                <!-- CRIAR MISSÃO -->

                <div class="admin-box">

                    <h3>
                        CRIAR NOVA MISSÃO
                    </h3>


                    <div class="form-grid">


                        <div class="campo">

                            <label>
                                Nome da missão
                            </label>

                            <input
                                id="missaoNome"
                                type="text"
                                placeholder="Ex: Roubo ao Banco"
                            >

                        </div>


                        <div class="campo">

                            <label>
                                Objetivo
                            </label>

                            <input
                                id="missaoObjetivo"
                                type="text"
                                placeholder="Ex: Roubar o banco"
                            >

                        </div>


                        <div class="campo campo-full">

                            <label>
                                Descrição
                            </label>

                            <textarea
                                id="missaoDescricao"
                                placeholder="Descrição da missão..."
                            ></textarea>

                        </div>


                        <div class="campo">

                          v>

    </div>

</div>



<!-- ==========================================
     LESTER
========================================== -->

<div
    id="lester"
    class="escondido"
>


<header>

    <h1>MISSÕES DO LESTER</h1>


    <div class="usuario">

        <strong id="nomeUsuario"></strong>


        <span class="saldo">

            $<span id="saldoUsuario">0</span>

        </span>


        <button
            class="btn-sair"
            onclick="sairLester()"
        >

            SAIR

        </button>

    </div>

</header>



<div class="container">


    <!-- ======================================
         ABAS
    ====================================== -->

    <div class="abas">


        <div
            id="abaMissoes"
            class="aba-lester-menu ativa"
            onclick="mostrarAbaLester('missoes')"
        >

            MISSÕES

        </div>


        <div
            id="abaAdmin"
            class="aba-lester-menu escondido"
            onclick="mostrarAbaLester('admin')"
        >

            ADMINISTRADOR

        </div>


    </div>



    <div id="mensagem"></div>



    <!-- ======================================
         MISSÕES
    ====================================== -->

    <div id="areaMissoes">

        <h2>Missões disponíveis</h2>


        <div
            id="listaMissoes"
            class="grade"
        ></div>

    </div>



    <!-- ======================================
         ADMIN
    ====================================== -->

    <div
        id="areaAdmin"
        class="escondido"
    >


        <div class="admin">

            <h2>CRIAR MISSÃO</h2>


            <input
                id="nomeMissao"
                type="text"
                placeholder="Nome da missão"
            >


            <textarea
                id="descricaoMissao"
                placeholder="Descrição da missão"
            ></textarea>


            <input
                id="objetivoMissao"
                type="text"
                placeholder="Objetivo"
            >


            <input
                id="recompensaMissao"
                type="number"
                placeholder="Recompensa"
                min="0"
            >


            <input
                id="prazoMissao"
                type="text"
                placeholder="Prazo / local"
            >


            <input
                id="duracaoMissao"
                type="number"
                placeholder="Duração"
                min="1"
            >


            <select id="unidadeMissao">

                <option value="minutos">
                    Minutos
                </option>

                <option value="horas">
                    Horas
                </option>

                <option value="dias">
                    Dias
                </option>

            </select>


            <button
                class="btn-vermelho"
                onclick="criarMissao()"
            >

                CRIAR MISSÃO

            </button>

        </div>



        <h2>Jogadores e dinheiro</h2>


        <div
            id="listaJogadores"
        ></div>



        <h2>Missões cadastradas</h2>


        <div
            id="listaAdminMissoes"
        ></div>


    </div>

</div>

</div>

<script>

/* ==========================================
   FIREBASE
========================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBwAUhihZQ3kwD9EuasUurXXLbPBdJqg",

    authDomain:
        "gta-rpg.firebaseapp.com",

    databaseURL:
        "https://gta-rpg-default-rtdb.firebaseio.com",

    projectId:
        "gta-rpg",

    storageBucket:
        "gta-rpg.firebasestorage.app",

    messagingSenderId:
        "318963858414",

    appId:
        "1:318963858414:web:cc7122486ac5a3d267ecff",

    measurementId:
        "G-K157521F0H"

};


firebase.initializeApp(firebaseConfig);


const banco =
    firebase.database();



/* ==========================================
   USUÁRIOS
========================================== */

const usuarios = {

    Kaius:"28/09",

    Gaby:"22/09",

    Duda:"13/09",

    Italo:"1822"

};


let usuarioAtual = null;

let saldos = {};

let missoes = {};

let missoesAceitas = {};



/* ==========================================
   ABRIR IMÓVEIS
========================================== */

function abrirImoveis(){

    window.location.href =
        "./imoveis.html";

}



/* ==========================================
   ABRIR ALVOS
========================================== */

function abrirAlvos(){

    window.location.href =
        "./alvos.html";

}



/* ==========================================
   ABRIR HACKER
========================================== */

function abrirHacker(){

    window.location.href =
        "./hacker.html";

}



/* ==========================================
   VERIFICAR ACESSO HACKER
========================================== */

function verificarAcessoHacker(){

    const aba =
        document.getElementById(
            "abaHacker"
        );


    if(!aba){

        return;

    }


    /*
     * ITALO É ADMINISTRADOR
     *
     * Sempre possui acesso.
     */

    if(usuarioAtual === "Italo"){

        aba.style.display =
            "flex";

        return;

    }


    /*
     * Se não houver usuário logado,
     * o Hacker fica escondido.
     */

    if(!usuarioAtual){

        aba.style.display =
            "none";

        return;

    }


    /*
     * Consulta:
     *
     * hackerAcessos/NOME
     */

    banco
        .ref(
            "hackerAcessos/" +
            usuarioAtual
        )
        .on(
            "value",
            function(snapshot){

                const acesso =
                    snapshot.val();


                if(
                    acesso &&
                    acesso.ativo === true
                ){

                    aba.style.display =
                        "flex";

                }

                else{

                    aba.style.display =
                        "none";

                }

            }
        );

}



/* ==========================================
   LOGIN LESTER
========================================== */

function abrirLogin(){

    document
        .getElementById("central")
        .classList.add("escondido");


    document
        .getElementById("login")
        .classList.remove("escondido");

}



function fazerLogin(){

    const usuario =
        document
        .getElementById("usuarioLogin")
        .value
        .trim();


    const senha =
        document
        .getElementById("senhaLogin")
        .value
        .trim();


    if(
        usuarios[usuario] &&
        usuarios[usuario] === senha
    ){

        usuarioAtual =
            usuario;


        sessionStorage.setItem(
            "usuarioAtual",
            usuario
        );


        abrirLester();

    }

    else{

        document
            .getElementById("erroLogin")
            .innerText =
            "Usuário ou senha incorretos.";

    }

}



/* ==========================================
   VOLTAR PARA CENTRAL
========================================== */

function voltarCentral(){

    document
        .getElementById("login")
        .classList.add("escondido");


    document
        .getElementById("central")
        .classList.remove("escondido");


    document
        .getElementById("erroLogin")
        .innerText = "";

}



/* ==========================================
   ABRIR LESTER
========================================== */

function abrirLester(){

    document
        .getElementById("central")
        .classList.add("escondido");


    document
        .getElementById("login")
        .classList.add("escondido");


    document
        .getElementById("lester")
        .classList.remove("escondido");


    document

/* =========================

function mostrarMissoes(){

        document.getElementById("listaMissoes");

    }


    lista.innerHTML = "";


    const agora = Date.now();


    const disponiveis =
        Object.values(missoes)
        .filter(function(missao){

            return (
                !missao.terminaEm ||
                missao.terminaEm > agora
            );

        });


    if(disponiveis.length === 0){

        lista.innerHTML = `
            <div class="vazio">
                Nenhuma missão disponível.
            </div>
        `;

        return;

    }


    disponiveis.forEach(function(missao){

        const div =
            document.createElement("div");


        div.className = "missao";


        const aceita =
            missoesAceitas[missao.id] &&
            missoesAceitas[missao.id][usuarioAtual];


        div.innerHTML = `

            <span
                class="cronometro"
                data-termina="${missao.terminaEm || 0}"
            >
                ${formatarTempo(
                    (missao.terminaEm || 0) - Date.now()
                )}

            <h3>
                ${missao.nome}
            </h3>

            <p>
                ${missao.descricao}
            </p>

            <p>
                <strong>Objetivo:</strong>
                ${missao.objetivo}
            </p>

                RECOMPENSA:
                $${Number(missao.recompensa || 0)
                    .toLocaleString("pt-BR")}

                PRAZO:
                ${missao.prazo || "Não informado"}
            </p>

            ${
                aceita

                ?

                `
                <button
                    class="btn-missao btn-cancelar"
                    onclick="cancelarMissao('${missao.id}')"
                >
                    AH, MUDEI DE IDEIA, NÃO QUERO MAIS

                    class="btn-missao"
                    onclick="aceitarMissao('${missao.id}')"

                    ACEITAR MISSÃO

                `

            }

        `;


        lista.appendChild(div);

    });

}

/* =========================
   CRIAR MISSÃO
========================= */

function criarMissao(){

    if(usuarioAtual !== "Italo"){

        return;

    }


    const nome =
        document
        .getElementById("nomeMissao")
        .value
        .trim();


    const descricao =
        document
        .getElementById("descricaoMissao")
        .value
        .trim();


    const objetivo =
        document
        .getElementById("objetivoMissao")
        .value
        .trim();


    const recompensa =
        Number(
            document
            .getElementById("recompensaMissao")
            .value
        );


    const prazo =
        document
        .getElementById("prazoMissao")
        .value
        .trim();


    const duracao =
        Number(
            document
            .getElementById("duracaoMissao")
            .value
        );


    const unidade =
        document
        .getElementById("unidadeMissao")
        .value;


    if(
        !nome ||
        !descricao ||
        !objetivo ||
        recompensa < 0 ||
        !duracao
    ){

        alert(
            "Preencha todos os campos da missão."
        );

        return;

    }


    let duracaoMs = 0;


    if(unidade === "minutos"){

        duracaoMs =
            duracao *
            60 *
            1000;

    }


    if(unidade === "horas"){

        duracaoMs =
            duracao *
            60 *
            60 *
            1000;

    }


    if(unidade === "dias"){

        duracaoMs =
            duracao *
            24 *
            60 *
            60 *
            1000;

    }


    const id =
        String(Date.now());


    const agora =
        Date.now();


    const novaMissao = {

        id:id,

        nome:nome,

        descricao:descricao,

        objetivo:objetivo,

        recompensa:recompensa,

        prazo:prazo,

        duracao:duracao,

        unidade:unidade,

        criadoEm:agora,

        terminaEm:
            agora +
            duracaoMs

    };


    banco
        .ref(
            "missoes/" + id
        )
        .set(novaMissao)
        .then(function(){

            document
                .getElementById("nomeMissao")
                .value = "";

            document
                .getElementById("descricaoMissao")
                .value = "";

            document
                .getElementById("objetivoMissao")
                .value = "";

            document
                .getElementById("recompensaMissao")
                .value = "";

            document
                .getElementById("prazoMissao")
                .value = "";

            document
                .getElementById("duracaoMissao")
                .value = "";


            mostrarMensagem(
                "Missão criada com sucesso!",
                "sucesso"
            );

        });

}

    atualizacoes[

    ] = null;


    banco
        .ref()
        .update(atualizacoes);

/* =========================
   CRONÔMETRO
========================= */

function formatarTempo(ms){

    if(ms <= 0){

        return "EXPIRADA";

    }


    let segundos =
        Math.floor(ms / 1000);


    const dias =
        Math.floor(
            segundos / 86400
        );


    segundos %= 86400;


    const horas =
        Math.floor(
            segundos / 3600
        );


    segundos %= 3600;


    const minutos =
        Math.floor(
            segundos / 60
        );


    segundos %= 60;


    if(dias > 0){

        return (
            dias + "d " +
            horas + "h " +
            minutos + "m"
        );

    }


    if(horas > 0){

        return (
            horas + "h " +
            minutos + "m " +
            segundos + "s"
        );

    }


    return (
        minutos + "m " +
        segundos + "s"
    );

}


function atualizarCronometros(){

    document
        .querySelectorAll(
            ".cronometro"
        )
        .forEach(function(elemento){

            const termina =
                Number(
                    elemento
                    .dataset
                    .termina
                );


            const restante =
                termina -
                Date.now();


            elemento.innerText =
                formatarTempo(
                    restante
                );

        });

}


setInterval(
    atualizarCronometros,
    1000
);
