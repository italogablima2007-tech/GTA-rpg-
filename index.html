<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Central do RPG</title>


<style>

/* ==========================================
   CONFIGURAÇÃO GERAL
========================================== */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:#101010;

    color:white;

}

.escondido{

    display:none !important;

}


/* ==========================================
   CENTRAL
========================================== */

#central{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    padding:30px;

}

.titulo{

    text-align:center;

    margin-bottom:40px;

}

.titulo h1{

    margin:0;

    font-size:42px;

    letter-spacing:2px;

}

.titulo p{

    color:#aaa;

    margin-top:10px;

}


/* ==========================================
   CARDS DA CENTRAL
========================================== */

.abas-central{

    width:100%;

    max-width:1200px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:25px;

}

.aba{

    min-height:220px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    cursor:pointer;

    transition:.2s;

    background:#1c1c1c;

    border:1px solid #333;

    overflow:hidden;

    position:relative;

}

.aba:hover{

    transform:scale(1.02);

    border-color:#777;

}

.aba h2{

    position:relative;

    z-index:2;

    font-size:25px;

    text-align:center;

}


/* ==========================================
   IMÓVEIS
========================================== */

.aba-imoveis{

    background:

        linear-gradient(
            rgba(0,0,0,.45),
            rgba(0,0,0,.65)
        );

}


/* ==========================================
   LESTER
========================================== */

.aba-lester{

    background-image:

        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.65)
        ),

        url("./lester.jpg");

    background-size:cover;

    background-position:center;

}


/* ==========================================
   ALVOS
========================================== */

.aba-alvos{

    background:

        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.65)
        ),

        url("./alvos.jpg");

    background-size:cover;

    background-position:center;

}


/* ==========================================
   HACKER
========================================== */

.aba-hacker{

    background:

        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.70)
        ),

        url("./hacker.jpg");

    background-size:cover;

    background-position:center;

}

.aba-hacker:hover{

    border-color:#00ff88;

}


/* ==========================================
   LOGIN
========================================== */

#login{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.login-box{

    width:100%;

    max-width:400px;

    background:#181818;

    border:1px solid #333;

    border-radius:15px;

    padding:30px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.5);

}

.login-box h1{

    text-align:center;

    margin-top:0;

}

.login-box p{

    text-align:center;

    color:#999;

}


/* ==========================================
   INPUTS
========================================== */

input,
textarea,
select{

    width:100%;

    padding:13px;

    margin:7px 0 15px;

    border-radius:7px;

    border:1px solid #444;

    background:#222;

    color:white;

    font-size:15px;

}

textarea{

    min-height:100px;

}


/* ==========================================
   BOTÕES
========================================== */

button{

    border:0;

    border-radius:7px;

    padding:12px 16px;

    cursor:pointer;

    font-weight:bold;

}

.btn-vermelho{

    width:100%;

    background:#c40000;

    color:white;

}

.btn-vermelho:hover{

    background:#a00000;

}

.btn-voltar{

    width:100%;

    margin-top:10px;

    background:#333;

    color:white;

}

.btn-sair{

    background:#333;

    color:white;

}

.btn-pequeno{

    background:#333;

    color:white;

    margin:3px;

}

.btn-pequeno:hover{

    background:#c40000;

}


/* ==========================================
   ERRO
========================================== */

.erro{

    color:#ff4444;

    text-align:center;

    margin-top:15px;

}


/* ==========================================
   LESTER
========================================== */

#lester{

    min-height:100vh;

}

header{

    background:#181818;

    border-bottom:1px solid #333;

    padding:18px 30px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    flex-wrap:wrap;

    gap:15px;

}

header h1{

    margin:0;

}

.usuario{

    display:flex;

    align-items:center;

    gap:20px;

}

.saldo{

    color:#42d66b;

    font-weight:bold;

}

.container{

    width:100%;

    max-width:1200px;

    margin:auto;

    padding:30px 20px;

}


/* ==========================================
   ABAS LESTER
========================================== */

.abas{

    display:flex;

    gap:10px;

    border-bottom:1px solid #333;

    margin-bottom:30px;

}

.aba-lester-menu{

    padding:13px 18px;

    cursor:pointer;

    color:#888;

    font-weight:bold;

}

.aba-lester-menu.ativa{

    color:#fff;

    border-bottom:
        3px solid #c40000;

}


/* ==========================================
   MISSÕES
========================================== */

.grade{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px,1fr)
        );

    gap:20px;

}

.missao{

    background:#1b1b1b;

    border:1px solid #333;

    border-radius:12px;

    padding:20px;

    position:relative;

}

.missao h3{

    margin-top:0;

}

.missao p{

    color:#bbb;

    line-height:1.5;

}

.recompensa{

    color:#42d66b !important;

    font-weight:bold;

}

.prazo{

    color:#ffb000 !important;

}

.cronometro{

    position:absolute;

    top:15px;

    right:15px;

    color:#ff4444;

    font-weight:bold;

}

.btn-missao{

    width:100%;

    margin-top:10px;

    background:#c40000;

    color:white;

}

.btn-cancelar{

    background:#444;

}


/* ==========================================
   ADMIN
========================================== */

.admin{

    background:#1b1b1b;

    border:1px solid #333;

    border-radius:12px;

    padding:25px;

    margin-bottom:30px;

}

.admin h2{

    color:#ff4444;

}

.admin-jogador{

    background:#222;

    border:1px solid #333;

    border-radius:10px;

    padding:15px;

    margin-bottom:10px;

}

.admin-jogador strong{

    display:block;

    margin-bottom:10px;

}

.mensagem{

    padding:15px;

    border-radius:8px;

    margin-bottom:20px;

    background:#222;

}

.sucesso{

    color:#42d66b;

}

.aviso{

    color:#ff4444;

}

.vazio{

    text-align:center;

    color:#777;

    padding:50px;

}


/* ==========================================
   RESPONSIVO
========================================== */

@media(max-width:900px){

    .abas-central{

        grid-template-columns:
            repeat(2,1fr);

    }

}

@media(max-width:700px){

    .abas-central{

        grid-template-columns:1fr;

    }

    .aba{

        min-height:170px;

    }

    .titulo h1{

        font-size:30px;

    }

    header{

        padding:15px;

    }

    .usuario{

        width:100%;

        justify-content:space-between;

    }

}

</style>

</head>


<body>


<!-- ==========================================
     CENTRAL
========================================== -->

<div id="central">

    <div class="titulo">

        <h1>CENTRAL DO RPG</h1>

        <p>Selecione uma área</p>

    </div>


    <div class="abas-central">


        <!-- ==================================
             IMÓVEIS
        ================================== -->

        <div
            class="aba aba-imoveis"
            onclick="abrirImoveis()"
        >

            <h2>IMÓVEIS</h2>

        </div>


        <!-- ==================================
             MISSÕES DO LESTER
        ================================== -->

        <div
            class="aba aba-lester"
            onclick="abrirLogin()"
        >

            <h2>MISSÕES DO LESTER</h2>

        </div>


        <!-- ==================================
             ALVOS
        ================================== -->

        <div
            class="aba aba-alvos"
            onclick="abrirAlvos()"
        >

            <h2>ALVOS</h2>

        </div>


        <!-- ==================================
             HACKER
        ================================== -->

        <div
            id="abaHacker"
            class="aba aba-hacker"
            onclick="abrirHacker()"
            style="display:none;"
        >

            <h2>HACKER</h2>

        </div>


    </div>

</div>



<!-- ==========================================
     LOGIN
========================================== -->

<div
    id="login"
    class="escondido"
>

    <div class="login-box">

        <h1>MISSÕES DO LESTER</h1>

        <p>Acesso restrito</p>


        <input
            id="usuarioLogin"
            type="text"
            placeholder="Usuário"
        >


        <input
            id="senhaLogin"
            type="password"
            placeholder="Senha"
        >


        <button
            class="btn-vermelho"
            onclick="fazerLogin()"
        >

            ENTRAR

        </button>


        <button
            class="btn-voltar"
            onclick="voltarCentral()"
        >

            VOLTAR

        </button>


        <div
            id="erroLogin"
            class="erro"
        ></div>

    </div>

</div>



<!-- ==========================================
     LESTER
========================================== -->

<div
    id="lester"
    class="escondido"
>


<header>

    <h1>MISSÕES DO LESTER</h1>


    <div class="usuario">

        <strong id="nomeUsuario"></strong>


        <span class="saldo">

            $<span id="saldoUsuario">0</span>

        </span>


        <button
            class="btn-sair"
            onclick="sairLester()"
        >

            SAIR

        </button>

    </div>

</header>



<div class="container">


    <!-- ======================================
         ABAS
    ====================================== -->

    <div class="abas">


        <div
            id="abaMissoes"
            class="aba-lester-menu ativa"
            onclick="mostrarAbaLester('missoes')"
        >

            MISSÕES

        </div>


        <div
            id="abaAdmin"
            class="aba-lester-menu escondido"
            onclick="mostrarAbaLester('admin')"
        >

            ADMINISTRADOR

        </div>


    </div>



    <div id="mensagem"></div>



    <!-- ======================================
         MISSÕES
    ====================================== -->

    <div id="areaMissoes">

        <h2>Missões disponíveis</h2>


        <div
            id="listaMissoes"
            class="grade"
        ></div>

    </div>



    <!-- ======================================
         ADMIN
    ====================================== -->

    <div
        id="areaAdmin"
        class="escondido"
    >


        <div class="admin">

            <h2>CRIAR MISSÃO</h2>


            <input
                id="nomeMissao"
                type="text"
                placeholder="Nome da missão"
            >


            <textarea
                id="descricaoMissao"
                placeholder="Descrição da missão"
            ></textarea>


            <input
                id="objetivoMissao"
                type="text"
                placeholder="Objetivo"
            >


            <input
                id="recompensaMissao"
                type="number"
                placeholder="Recompensa"
                min="0"
            >


            <input
                id="prazoMissao"
                type="text"
                placeholder="Prazo / local"
            >


            <input
                id="duracaoMissao"
                type="number"
                placeholder="Duração"
                min="1"
            >


            <select id="unidadeMissao">

                <option value="minutos">
                    Minutos
                </option>

                <option value="horas">
                    Horas
                </option>

                <option value="dias">
                    Dias
                </option>

            </select>


            <button
                class="btn-vermelho"
                onclick="criarMissao()"
            >

                CRIAR MISSÃO

            </button>

        </div>



        <h2>Jogadores e dinheiro</h2>


        <div
            id="listaJogadores"
        ></div>



        <h2>Missões cadastradas</h2>


        <div
            id="listaAdminMissoes"
        ></div>


    </div>

</div>

</div>

const banco =
    firebase.database();



/* ==========================================
   USUÁRIOS
========================================== */

const usuarios = {

    Kaius:"28/09",

    Gaby:"22/09",

    Duda:"13/09",

    Italo:"1822"

};


let usuarioAtual = null;

let saldos = {};

let missoes = {};

let missoesAceitas = {};



/* ==========================================
   ABRIR IMÓVEIS
========================================== */

function abrirImoveis(){

    window.location.href =
        "./imoveis.html";

}



/* ==========================================
   ABRIR ALVOS
========================================== */

function abrirAlvos(){

    window.location.href =
        "./alvos.html";

}



/* ==========================================
   ABRIR HACKER
========================================== */

function abrirHacker(){

    window.location.href =
        "./hacker.html";

}



/* ==========================================
   VERIFICAR ACESSO HACKER
========================================== */

function verificarAcessoHacker(){

    const aba =
        document.getElementById(
            "abaHacker"
        );


    if(!aba){

        return;

    }


    /*
     * ITALO É ADMINISTRADOR
     *
     * Sempre possui acesso.
     */

    if(usuarioAtual === "Italo"){

        aba.style.display =
            "flex";

        return;

    }


    /*
     * Se não houver usuário logado,
     * o Hacker fica escondido.
     */

    if(!usuarioAtual){

        aba.style.display =
            "none";

        return;

    }


    /*
     * Consulta:
     *
     * hackerAcessos/NOME
     */

    banco
        .ref(
            "hackerAcessos/" +
            usuarioAtual
        )
        .on(
            "value",
            function(snapshot){

                const acesso =
                    snapshot.val();


                if(
                    acesso &&
                    acesso.ativo === true
                ){

                    aba.style.display =
                        "flex";

                }

                else{

                    aba.style.display =
                        "none";

                }

            }
        );

}



/* ==========================================
   LOGIN LESTER
========================================== */

function abrirLogin(){

    document
        .getElementById("central")
        .classList.add("escondido");


    document
        .getElementById("login")
        .classList.remove("escondido");

}



function fazerLogin(){

    const usuario =
        document
        .getElementById("usuarioLogin")
        .value
        .trim();


    const senha =
        document
        .getElementById("senhaLogin")
        .value
        .trim();


    if(
        usuarios[usuario] &&
        usuarios[usuario] === senha
    ){

        usuarioAtual =
            usuario;


        sessionStorage.setItem(
            "usuarioAtual",
            usuario
        );


        abrirLester();

    }

    else{

        document
            .getElementById("erroLogin")
            .innerText =
            "Usuário ou senha incorretos.";

    }

}



/* ==========================================
   VOLTAR PARA CENTRAL
========================================== */

function voltarCentral(){

    document
        .getElementById("login")
        .classList.add("escondido");


    document
        .getElementById("central")
        .classList.remove("escondido");


    document
        .getElementById("erroLogin")
        .innerText = "";

}



/* ==========================================
   ABRIR LESTER
========================================== */

function abrirLester(){

    document
        .getElementById("central")
        .classList.add("escondido");


    document
        .getElementById("login")
        .classList.add("escondido");


    document
        .getElementById("lester")
        .classList.remove("escondido");


    document
        .getElementById("nomeUsuario")
        .innerText =
        usuarioAtual;


    /*
     * Hacker é atualizado
     * sempre que o jogador entra.
     */

    verificarAcessoHacker();


    if(
        usuarioAtual === "Italo"
    ){

        document
            .getElementById("abaAdmin")
            .classList.remove(
                "escondido"
            );

    }


    carregarDados();

}



/* ==========================================
   LOGIN SALVO
========================================== */

const usuarioSalvo =
    sessionStorage.getItem(
        "usuarioAtual"
    );


if(
    usuarioSalvo &&
    usuarios[usuarioSalvo]
){

    usuarioAtual =
        usuarioSalvo;


    /*
     * Se já estava logado,
     * abre Lester.
     */

    abrirLester();

}



/* ==========================================
   CARREGAR DADOS
========================================== */

function carregarDados(){


    /* ======================================
       SALDOS
    ====================================== */

    banco
        .ref("saldos")
        .on(
            "value",
            function(snapshot){

                saldos =
                    snapshot.val() || {};


                const elemento =
                    document.getElementById(
                        "saldoUsuario"
                    );


                if(elemento){

                    elemento.innerText =
                        Number(
                            saldos[
                                usuarioAtual
                            ] || 0
                        ).toLocaleString(
                            "pt-BR"
                        );

                }


                mostrarJogadores();

            }
        );



    /* ======================================
       MIS     type="text"
                placeholder="Prazo / local"
            >


            <input
                id="duracaoMissao"
                type="number"
                placeholder="Duração"
                min="1"
            >


            <select id="unidadeMissao">

                <option value="minutos">
                    Minutos
                </option>

                <option value="horas">
                    Horas
                </option>

                <option value="dias">
                    Dias
                </option>

            </select>


            <button
                class="btn-vermelho"
                onclick="criarMissao()"
            >
                CRIAR MISSÃO
            </button>

        </div>


        <h2>Jogadores e dinheiro</h2>

        <div id="listaJogadores"></div>


        <h2>Missões cadastradas</h2>

        <div
            id="listaAdminMissoes"
        ></div>

    </div>

</div>

</div>

/* =========================
   CARREGAR DADOS
========================= */

function carregarDados(){


    /* SALDOS */

    banco
        .ref("saldos")
        .on("value",function(snapshot){

            saldos =
                snapshot.val() || {};


            document
                .getElementById("saldoUsuario")
                .innerText =
                Number(
                    saldos[usuarioAtual] || 0
                ).toLocaleString("pt-BR");


            mostrarJogadores();

        });


    /* MISSÕES */

    banco
        .ref("missoes")
        .on("value",function(snapshot){

            missoes =
                snapshot.val() || {};


            mostrarMissoes();

            mostrarAdminMissoes();

        });


    /* ACEITAS */

    banco
        .ref("missoesAceitas")
        .on("value",function(snapshot){

            missoesAceitas =
                snapshot.val() || {};


            mostrarMissoes();

            mostrarAdminMissoes();

        });

}


/* =========================
   ABAS
========================= */

function mostrarAbaLester(aba){

    document
        .getElementById("areaMissoes")
        .classList.add("escondido");

    document
        .getElementById("areaAdmin")
        .classList.add("escondido");


    document
        .getElementById("abaMissoes")
        .classList.remove("ativa");

    document
        .getElementById("abaAdmin")
        .classList.remove("ativa");


    if(aba === "missoes"){

        document
            .getElementById("areaMissoes")
            .classList.remove("escondido");

        document
            .getElementById("abaMissoes")
            .classList.add("ativa");

    }


    if(
        aba === "admin" &&
        usuarioAtual === "Italo"
    ){

        document
            .getElementById("areaAdmin")
            .classList.remove("escondido");

        document
            .getElementById("abaAdmin")
            .classList.add("ativa");

    }

}


/* =========================
   MOSTRAR MISSÕES
========================= */

function mostrarMissoes(){

    const lista =
        document.getElementById("listaMissoes");


    if(!lista){

        return;

    }


    lista.innerHTML = "";


    const agora = Date.now();


    const disponiveis =
        Object.values(missoes)
        .filter(function(missao){

            return (
                !missao.terminaEm ||
                missao.terminaEm > agora
            );

        });


    if(disponiveis.length === 0){

        lista.innerHTML = `
            <div class="vazio">
                Nenhuma missão disponível.
            </div>
        `;

        return;

    }


    disponiveis.forEach(function(missao){

        const div =
            document.createElement("div");


        div.className = "missao";


        const aceita =
            missoesAceitas[missao.id] &&
            missoesAceitas[missao.id][usuarioAtual];


        div.innerHTML = `

            <span
                class="cronometro"
                data-termina="${missao.terminaEm || 0}"
            >
                ${formatarTempo(
                    (missao.terminaEm || 0) - Date.now()
                )}
            </span>

            <h3>
                ${missao.nome}
            </h3>

            <p>
                ${missao.descricao}
            </p>

            <p>
                <strong>Objetivo:</strong>
                ${missao.objetivo}
            </p>

            <p class="recompensa">
                RECOMPENSA:
                $${Number(missao.recompensa || 0)
                    .toLocaleString("pt-BR")}
            </p>

            <p class="prazo">
                PRAZO:
                ${missao.prazo || "Não informado"}
            </p>

            ${
                aceita

                ?

                `
                <button
                    class="btn-missao btn-cancelar"
                    onclick="cancelarMissao('${missao.id}')"
                >
                    AH, MUDEI DE IDEIA, NÃO QUERO MAIS
                </button>
                `

                :

                `
                <button
                    class="btn-missao"
                    onclick="aceitarMissao('${missao.id}')"
                >
                    ACEITAR MISSÃO
                </button>
                `

            }

        `;


        lista.appendChild(div);

    });

}


/* =========================
   ACEITAR
========================= */

function aceitarMissao(id){

    banco
        .ref(
            "missoesAceitas/" +
            id +
            "/" +
            usuarioAtual
        )
        .set(true)
        .then(function(){

            mostrarMensagem(
                "VOCÊ ACEITOU A MISSÃO!",
                "sucesso"
            );

        });

}


/* =========================
   CANCELAR
========================= */

function cancelarMissao(id){

    banco
        .ref(
            "missoesAceitas/" +
            id +
            "/" +
            usuarioAtual
        )
        .remove()
        .then(function(){

            mostrarMensagem(
                "Você cancelou a missão.",
                "aviso"
            );

        });

}


/* =========================
   CRIAR MISSÃO
========================= */

function criarMissao(){

    if(usuarioAtual !== "Italo"){

        return;

    }


    const nome =
        document
        .getElementById("nomeMissao")
        .value
        .trim();


    const descricao =
        document
        .getElementById("descricaoMissao")
        .value
        .trim();


    const objetivo =
        document
        .getElementById("objetivoMissao")
        .value
        .trim();


    const recompensa =
        Number(
            document
            .getElementById("recompensaMissao")
            .value
        );


    const prazo =
        document
        .getElementById("prazoMissao")
        .value
        .trim();


    const duracao =
        Number(
            document
            .getElementById("duracaoMissao")
            .value
        );


    const unidade =
        document
        .getElementById("unidadeMissao")
        .value;


    if(
        !nome ||
        !descricao ||
        !objetivo ||
        recompensa < 0 ||
        !duracao
    ){

        alert(
            "Preencha todos os campos da missão."
        );

        return;

    }


    let duracaoMs = 0;


    if(unidade === "minutos"){

        duracaoMs =
            duracao *
            60 *
            1000;

    }


    if(unidade === "horas"){

        duracaoMs =
            duracao *
            60 *
            60 *
            1000;

    }


    if(unidade === "dias"){

        duracaoMs =
            duracao *
            24 *
            60 *
            60 *
            1000;

    }


    const id =
        String(Date.now());


    const agora =
        Date.now();


    const novaMissao = {

        id:id,

        nome:nome,

        descricao:descricao,

        objetivo:objetivo,

        recompensa:recompensa,

        prazo:prazo,

        duracao:duracao,

        unidade:unidade,

        criadoEm:agora,

        terminaEm:
            agora +
            duracaoMs

    };


    banco
        .ref(
            "missoes/" + id
        )
        .set(novaMissao)
        .then(function(){

            document
                .getElementById("nomeMissao")
                .value = "";

            document
                .getElementById("descricaoMissao")
                .value = "";

            document
                .getElementById("objetivoMissao")
                .value = "";

            document
                .getElementById("recompensaMissao")
                .value = "";

            document
                .getElementById("prazoMissao")
                .value = "";

            document
                .getElementById("duracaoMissao")
                .value = "";


            mostrarMensagem(
                "Missão criada com sucesso!",
                "sucesso"
            );

        });

}

/* =========================
   ALTERAR SALDO
========================= */

function alterarSaldo(nome,valor){

    if(usuarioAtual !== "Italo"){

        return;

    }


    const saldo =
        Number(saldos[nome] || 0);


    const novoSaldo =
        Math.max(
            0,
            saldo + valor
        );


    banco
        .ref(
            "saldos/" + nome
        )
        .set(novoSaldo);

}


/* =========================
   ADMIN MISSÕES
========================= */

function mostrarAdminMissoes(){

    if(usuarioAtual !== "Italo"){

        return;

    }


    const lista =
        document
        .getElementById(
            "listaAdminMissoes"
        );


    if(!lista){

        return;

    }


    lista.innerHTML = "";


    Object.values(missoes)
    .forEach(function(missao){

        const div =
            document.createElement("div");


        div.className =
            "admin-jogador";


        let aceitos = [];


        if(
            missoesAceitas[missao.id]
        ){

            aceitos =
                Object.keys(
                    missoesAceitas[
                        missao.id
                    ]
                );

        }


        div.innerHTML = `

            <strong>
                ${missao.nome}
            </strong>

            <p>
                Recompensa:
                $${Number(
                    missao.recompensa || 0
                ).toLocaleString("pt-BR")}
            </p>

            <p>
                Aceitaram:
                ${
                    aceitos.length
                    ?
                    aceitos.join(", ")
                    :
                    "Ninguém"
                }
            </p>

            <button
                class="btn-pequeno"
                onclick="excluirMissao('${missao.id}')"
            >
                EXCLUIR MISSÃO
            </button>

        `;


        lista.appendChild(div);

    });

}


/* =========================
   EXCLUIR MISSÃO
========================= */

function excluirMissao(id){

    if(usuarioAtual !== "Italo"){

        return;

    }


    if(
        !confirm(
            "Deseja excluir esta missão?"
        )
    ){

        return;

    }


    const atualizacoes = {};


    atualizacoes[
        "missoes/" + id
    ] = null;


    atualizacoes[
        "missoesAceitas/" + id
    ] = null;


    banco
        .ref()
        .update(atualizacoes);

}


/* =========================
   CRONÔMETRO
========================= */

function formatarTempo(ms){

    if(ms <= 0){

        return "EXPIRADA";

    }


    let segundos =
        Math.floor(ms / 1000);


    const dias =
        Math.floor(
            segundos / 86400
        );


    segundos %= 86400;


    const horas =
        Math.floor(
            segundos / 3600
        );


    segundos %= 3600;


    const minutos =
        Math.floor(
            segundos / 60
        );


    segundos %= 60;


    if(dias > 0){

        return (
            dias + "d " +
            horas + "h " +
            minutos + "m"
        );

    }


    if(horas > 0){

        return (
            horas + "h " +
            minutos + "m " +
            segundos + "s"
        );

    }


    return (
        minutos + "m " +
        segundos + "s"
    );

}


function atualizarCronometros(){

    document
        .querySelectorAll(
            ".cronometro"
        )
        .forEach(function(elemento){

            const termina =
                Number(
                    elemento
                    .dataset
                    .termina
                );


            const restante =
                termina -
                Date.now();


            elemento.innerText =
                formatarTempo(
                    restante
                );

        });

}


setInterval(
    atualizarCronometros,
    1000
);
