<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Los Santos Imóveis</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#222;
}

/* LOGIN */

#login{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#fff;
}

.login-box{
    width:100%;
    max-width:420px;
    padding:35px;
    border-radius:15px;
    background:white;
    border:1px solid #ddd;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h1{
    margin:0;
    color:#c40000;
    font-size:30px;
}

.logo p{
    margin-top:8px;
    color:#777;
}

input,
textarea{
    width:100%;
    padding:13px;
    margin:7px 0 15px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:100px;
}

button{
    padding:12px 16px;
    border:0;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.btn-vermelho{
    width:100%;
    background:#c40000;
    color:white;
}

.btn-vermelho:hover{
    background:#a00000;
}

.btn-voltar{
    width:100%;
    margin-top:10px;
    background:#eee;
    color:#333;
}

.erro{
    text-align:center;
    color:#c40000;
    margin-top:15px;
}

/* SITE */

.escondido{
    display:none !important;
}

header{
    background:white;
    border-bottom:1px solid #ddd;
    padding:18px 30px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    flex-wrap:wrap;
    gap:15px;
}

header h1{
    margin:0;
    color:#c40000;
}

.usuario{
    display:flex;
    align-items:center;
    gap:15px;
}

.saldo{
    font-weight:bold;
    color:#c40000;
}

.btn-sair{
    background:#222;
    color:white;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

/* ABAS */

.abas{
    display:flex;
    gap:10px;
    margin-bottom:30px;
    border-bottom:1px solid #ddd;
}

.aba{
    padding:13px 18px;
    cursor:pointer;
    font-weight:bold;
    color:#777;
}

.aba.ativa{
    color:#c40000;
    border-bottom:3px solid #c40000;
}

/* IMÓVEIS */

.grade{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.imovel{
    background:white;
    border-radius:12px;
    overflow:hidden;
    border:1px solid #ddd;
    box-shadow:0 5px 15px rgba(0,0,0,.07);
}

.imovel img{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
}

.imovel-info{
    padding:20px;
}

.imovel h3{
    margin-top:0;
}

.local{
    color:#777;
}

.descricao{
    color:#555;
    line-height:1.5;
}

.preco{
    font-size:24px;
    font-weight:bold;
    color:#c40000;
    margin:15px 0;
}

.btn-comprar{
    width:100%;
    background:#c40000;
    color:white;
}

.btn-comprar:hover{
    background:#a00000;
}

.vazio{
    text-align:center;
    color:#888;
    padding:50px 20px;
}

/* ADMIN */

.admin{
    background:white;
    border:1px solid #ddd;
    border-radius:12px;
    padding:25px;
    margin-bottom:30px;
}

.admin h2{
    color:#c40000;
}

.imovel-admin{
    background:#fafafa;
    border:1px solid #ddd;
    border-radius:10px;
    padding:18px;
    margin-bottom:15px;
}

.btn-excluir{
    background:#222;
    color:white;
}

.btn-excluir:hover{
    background:#c40000;
}

.proprietario{
    color:#198754;
    font-weight:bold;
}

.disponivel{
    color:#c40000;
    font-weight:bold;
}

.mensagem{
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    background:#eee;
}

.sucesso{
    background:#e5f6eb;
    color:#147333;
}

.aviso{
    background:#fff1f1;
    color:#a00000;
}

@media(max-width:600px){

    header{
        padding:15px;
    }

    header h1{
        font-size:22px;
    }

    .usuario{
        width:100%;
        justify-content:space-between;
    }

}

</style>
</head>

<body>


<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div id="login">

    <div class="login-box">

        <div class="logo">

            <h1>LOS SANTOS IMÓVEIS</h1>

            <p>Encontre seu novo endereço.</p>

        </div>


        <input
            id="usuario"
            type="text"
            placeholder="Usuário"
        >


        <input
            id="senha"
            type="password"
            placeholder="Senha"
        >


        <button
            class="btn-vermelho"
            onclick="fazerLogin()"
        >
            ENTRAR
        </button>


        <button
            class="btn-voltar"
            onclick="voltarCentral()"
        >
            VOLTAR
        </button>


        <div
            id="erro"
            class="erro"
        ></div>

    </div>

</div>


<!-- ========================= -->
<!-- SITE -->
<!-- ========================= -->

<div
    id="site"
    class="escondido"
>


<header>

    <h1>LOS SANTOS IMÓVEIS</h1>

    <div class="usuario">

        <span>
            <strong id="nomeUsuario"></strong>
        </span>

        <span class="saldo">
            $<span id="saldoUsuario">0</span>
        </span>

        <button
            class="btn-sair"
            onclick="sair()"
        >
            SAIR
        </button>

    </div>

</header>


<div class="container">


    <!-- ABAS -->

    <div class="abas">

        <div
            id="abaVenda"
            class="aba ativa"
            onclick="mostrarAba('venda')"
        >
            IMÓVEIS À VENDA
        </div>


        <div
            id="abaComprados"
            class="aba"
            onclick="mostrarAba('comprados')"
        >
            IMÓVEIS ADQUIRIDOS
        </div>


        <div
            id="abaAdmin"
            class="aba escondido"
            onclick="mostrarAba('admin')"
        >
            ADMINISTRADOR
        </div>

    </div>


    <div id="mensagem"></div>


    <!-- ========================= -->
    <!-- IMÓVEIS À VENDA -->
    <!-- ========================= -->

    <div id="venda">

        <h2>Imóveis disponíveis</h2>

        <div
            id="listaVenda"
            class="grade"
        ></div>

    </div>


    <!-- ========================= -->
    <!-- IMÓVEIS ADQUIRIDOS -->
    <!-- ========================= -->

    <div
        id="comprados"
        class="escondido"
    >

        <h2>Meus imóveis</h2>

        <div
            id="listaComprados"
            class="grade"
        ></div>

    </div>


    <!-- ========================= -->
    <!-- ADMIN -->
    <!-- ========================= -->

    <div
        id="admin"
        class="escondido"
    >

        <div class="admin">

            <h2>ADMINISTRAÇÃO DE IMÓVEIS</h2>

            <p>
                Área exclusiva do administrador.
            </p>


            <input
                id="nomeImovel"
                type="text"
                placeholder="Nome do imóvel"
            >


            <input
                id="localizacaoImovel"
                type="text"
                placeholder="Localização"
            >


            <textarea
                id="descricaoImovel"
                placeholder="Descrição do imóvel"
            ></textarea>


            <input
                id="precoImovel"
                type="number"
                placeholder="Preço"
                min="0"
            >


            <input
                id="fotoImovel"
                type="text"
                placeholder="URL da foto"
            >


            <button
                class="btn-vermelho"
                onclick="adicionarImovel()"
            >
                ADICIONAR IMÓVEL
            </button>

        </div>


        <h2>Imóveis cadastrados</h2>

        <div id="listaAdmin"></div>

    </div>

</div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

    apiKey: "AIzaSyBwAUhihZQ3kwD9EuasUurXXLbPBdJqg",

    authDomain: "gta-rpg.firebaseapp.com",

    databaseURL: "https://gta-rpg-default-rtdb.firebaseio.com",

    projectId: "gta-rpg",

    storageBucket: "gta-rpg.firebasestorage.app",

    messagingSenderId: "318963858414",

    appId: "1:318963858414:web:cc7122486ac5a3d267ecff",

    measurementId: "G-K157521F0H"

};


firebase.initializeApp(firebaseConfig);

const banco = firebase.database();


/* =========================
   USUÁRIOS
========================= */

const usuarios = {

    Kaius: "28/09",

    Gaby: "22/09",

    Duda: "13/09",

    Italo: "1822"

};


let usuarioAtual = null;

let imoveis = {};

let saldoAtual = 0;


/* =========================
   LOGIN
========================= */

function fazerLogin(){

    const usuario =
        document.getElementById("usuario")
        .value
        .trim();

    const senha =
        document.getElementById("senha")
        .value
        .trim();


    if(
        usuarios[usuario] &&
        usuarios[usuario] === senha
    ){

        usuarioAtual = usuario;


        sessionStorage.setItem(
            "usuarioAtual",
            usuario
        );


        document.getElementById("login")
            .classList.add("escondido");


        document.getElementById("site")
            .classList.remove("escondido");


        document.getElementById("nomeUsuario")
            .innerText = usuario;


        if(usuario === "Italo"){

            document.getElementById("abaAdmin")
                .classList.remove("escondido");

        }


        carregarDados();

    }

    else{

        document.getElementById("erro")
            .innerText =
            "Usuário ou senha incorretos.";

    }

}


/* =========================
   VERIFICAR LOGIN SALVO
========================= */

const usuarioSalvo =
    sessionStorage.getItem("usuarioAtual");


if(usuarioSalvo && usuarios[usuarioSalvo]){

    usuarioAtual = usuarioSalvo;

    document.getElementById("login")
        .classList.add("escondido");

    document.getElementById("site")
        .classList.remove("escondido");

    document.getElementById("nomeUsuario")
        .innerText = usuarioAtual;


    if(usuarioAtual === "Italo"){

        document.getElementById("abaAdmin")
            .classList.remove("escondido");

    }


    carregarDados();

}


/* =========================
   CARREGAR DADOS
========================= */

function carregarDados(){

    /* SALDO */

    banco.ref(
        "saldos/" + usuarioAtual
    ).on("value", function(snapshot){

        saldoAtual =
            Number(snapshot.val() || 0);

        document.getElementById("saldoUsuario")
            .innerText = saldoAtual;

    });


    /* IMÓVEIS */

    banco.ref("imoveis").on(
        "value",
        function(snapshot){

            imoveis =
                snapshot.val() || {};

            mostrarImoveis();

            mostrarComprados();

            mostrarAdmin();

        }
    );

}


/* =========================
   ABAS
========================= */

function mostrarAba(aba){

    document.getElementById("venda")
        .classList.add("escondido");

    document.getElementById("comprados")
        .classList.add("escondido");

    document.getElementById("admin")
        .classList.add("escondido");


    document.getElementById("abaVenda")
        .classList.remove("ativa");

    document.getElementById("abaComprados")
        .classList.remove("ativa");


    if(usuarioAtual === "Italo"){

        document.getElementById("abaAdmin")
            .classList.remove("ativa");

    }


    if(aba === "venda"){

        document.getElementById("venda")
            .classList.remove("escondido");

        document.getElementById("abaVenda")
            .classList.add("ativa");

    }


    if(aba === "comprados"){

        document.getElementById("comprados")
            .classList.remove("escondido");

        document.getElementById("abaComprados")
            .classList.add("ativa");

    }


    if(aba === "admin" && usuarioAtual === "Italo"){

        document.getElementById("admin")
            .classList.remove("escondido");

        document.getElementById("abaAdmin")
            .classList.add("ativa");

    }

}


/* =========================
   MOSTRAR IMÓVEIS
========================= */

function mostrarImoveis(){

    const lista =
        document.getElementById("listaVenda");

    lista.innerHTML = "";


    const disponiveis =
        Object.values(imoveis)
        .filter(function(imovel){

            return !imovel.proprietario;

        });


    if(disponiveis.length === 0){

        lista.innerHTML = `
            <div class="vazio">
                Nenhum imóvel disponível no momento.
            </div>
        `;

        return;

    }


    disponiveis.forEach(function(imovel){

        const div =
            document.createElement("div");

        div.className = "imovel";


        div.innerHTML = `

            <img
                src="${imovel.foto}"
                alt="${imovel.nome}"
                onerror="this.src='https://via.placeholder.com/600x400?text=Imóvel'"
            >

            <div class="imovel-info">

                <h3>
                    ${imovel.nome}
                </h3>

                <p class="local">
                    📍 ${imovel.localizacao}
                </p>

                <p class="descricao">
                    ${imovel.descricao}
                </p>

                <div class="preco">
                    $${Number(imovel.preco).toLocaleString("pt-BR")}
                </div>

                <button
                    class="btn-comprar"
                    onclick="comprarImovel('${imovel.id}')"
                >
                    COMPRAR IMÓVEL
                </button>

            </div>

        `;


        lista.appendChild(div);

    });

}


/* =========================
   COMPRAR IMÓVEL
========================= */

function comprarImovel(id){

    if(usuarioAtual === "Italo"){

        alert(
            "O administrador não pode comprar imóveis."
        );

        return;

    }


    const imovel =
        imoveis[id];


    if(!imovel){

        return;

    }


    if(imovel.proprietario){

        mostrarMensagem(
            "Este imóvel já foi vendido.",
            "aviso"
        );

        return;

    }


    const preco =
        Number(imovel.preco);


    const saldo =
        Number(saldoAtual);


    if(saldo < preco){

        mostrarMensagem(
            "Você não possui dinheiro suficiente na conta.",
            "aviso"
        );

        return;

    }


    const confirmar =
        confirm(
            "Deseja comprar este imóvel por $" +
            preco.toLocaleString("pt-BR") +
            "?"
        );


    if(!confirmar){

        return;

    }


    const novoSaldo =
        saldo - preco;


    const atualizacoes = {};


    atualizacoes[
        "saldos/" + usuarioAtual
    ] = novoSaldo;


    atualizacoes[
        "imoveis/" +
        id +
        "/proprietario"
    ] = usuarioAtual;


    atualizacoes[
        "imoveis/" +
        id +
        "/vendidoEm"
    ] = Date.now();


    atualizacoes[
        "comprasImoveis/" +
        usuarioAtual +
        "/" +
        id
    ] = {

        id: id,

        nome: imovel.nome,

        localizacao: imovel.localizacao,

        descricao: imovel.descricao,

        preco: preco,

        foto: imovel.foto,

        compradoEm: Date.now()

    };


    banco.ref()
        .update(atualizacoes)
        .then(function(){

            mostrarMensagem(
                "Imóvel comprado com sucesso!",
                "sucesso"
            );

            mostrarAba("comprados");

        })
        .catch(function(erro){

            console.error(erro);

            mostrarMensagem(
                "Não foi possível concluir a compra.",
                "aviso"
            );

        });

}


/* =========================
   IMÓVEIS COMPRADOS
========================= */

function mostrarComprados(){

    const lista =
        document.getElementById("listaComprados");

    lista.innerHTML = "";


    if(usuarioAtual === "Italo"){

        lista.innerHTML = `
            <div class="vazio">
                O administrador não possui imóveis adquiridos.
            </div>
        `;

        return;

    }


    const comprados =
        Object.values(imoveis)
        .filter(function(imovel){

            return imovel.proprietario === usuarioAtual;

        });


    if(comprados.length === 0){

        lista.innerHTML = `
            <div class="vazio">
                Você ainda não possui imóveis.
            </div>
        `;

        return;

    }


    comprados.forEach(function(imovel){

        const div =
            document.createElement("div");

        div.className = "imovel";


        div.innerHTML = `

            <img
                src="${imovel.foto}"
                alt="${imovel.nome}"
                onerror="this.src='https://via.placeholder.com/600x400?text=Imóvel'"
            >

            <div class="imovel-info">

                <h3>
                    ${imovel.nome}
                </h3>

                <p class="local">
                    📍 ${imovel.localizacao}
                </p>

                <p class="descricao">
                    ${imovel.descricao}
                </p>

                <p class="proprietario">
                    PROPRIETÁRIO: ${usuarioAtual}
                </p>

            </div>

        `;


        lista.appendChild(div);

    });

}


/* =========================
   ADMIN
========================= */

function adicionarImovel(){

    if(usuarioAtual !== "Italo"){

        return;

    }


    const nome =
        document.getElementById("nomeImovel")
        .value.trim();


    const localizacao =
        document.getElementById("localizacaoImovel")
        .value.trim();


    const descricao =
        document.getElementById("descricaoImovel")
        .value.trim();


    const preco =
        Number(
            document.getElementById("precoImovel")
            .value
        );


    const foto =
        document.getElementById("fotoImovel")
        .value.trim();


    if(
        !nome ||
        !localizacao ||
        !descricao ||
        !preco ||
        preco <= 0
    ){

        alert(
            "Preencha nome, localização, descrição e preço."
        );

        return;

    }


    const id =
        String(Date.now());


    const novoImovel = {

        id: id,

        nome: nome,

        localizacao: localizacao,

        descricao: descricao,

        preco: preco,

        foto: foto ||
            "https://via.placeholder.com/600x400?text=Imóvel",

        proprietario: null,

        criadoEm: Date.now()

    };


    banco.ref(
        "imoveis/" + id
    ).set(novoImovel);


    document.getElementById("nomeImovel")
        .value = "";

    document.getElementById("localizacaoImovel")
        .value = "";

    document.getElementById("descricaoImovel")
        .value = "";

    document.getElementById("precoImovel")
        .value = "";

    document.getElementById("fotoImovel")
        .value = "";


    mostrarMensagem(
        "Imóvel cadastrado com sucesso!",
        "sucesso"
    );

}


/* =========================
   LISTA ADMIN
========================= */

function mostrarAdmin(){

    const lista =
        document.getElementById("listaAdmin");


    if(usuarioAtual !== "Italo"){

        return;

    }


    lista.innerHTML = "";


    Object.values(imoveis)
    .forEach(function(imovel){

        const div =
            document.createElement("div");

        div.className =
            "imovel-admin";


        let status;


        if(imovel.proprietario){

            status = `
                <p class="proprietario">
                    Vendido para: ${imovel.proprietario}
                </p>
            `;

        }

        else{

            status = `
                <p class="disponivel">
                    Disponível para venda
                </p>
            `;

        }


        div.innerHTML = `

            <strong>
                ${imovel.nome}
            </strong>

            <p>
                📍 ${imovel.localizacao}
            </p>

            <p>
                Preço:
                <strong>
                    $${Number(imovel.preco)
                        .toLocaleString("pt-BR")}
                </strong>
            </p>

            ${status}

            ${
                !imovel.proprietario
                ? `
                    <button
                        class="btn-excluir"
                        onclick="excluirImovel('${imovel.id}')"
                    >
                        EXCLUIR
                    </button>
                `
                : ""
            }

        `;


        lista.appendChild(div);

    });

}


/* =========================
   EXCLUIR
========================= */

function excluirImovel(id){

    if(usuarioAtual !== "Italo"){

        return;

    }


    if(
        !confirm(
            "Deseja realmente excluir este imóvel?"
        )
    ){

        return;

    }


    banco.ref(
        "imoveis/" + id
    ).remove();

}


/* =========================
   MENSAGEM
========================= */

function mostrarMensagem(texto,tipo){

    const elemento =
        document.getElementById("mensagem");


    elemento.innerHTML =
        `<div class="mensagem ${tipo}">
            ${texto}
        </div>`;


    setTimeout(function(){

        elemento.innerHTML = "";

    },5000);

}


/* =========================
   SAIR
========================= */

function sair(){

    sessionStorage.removeItem(
        "usuarioAtual"
    );


    usuarioAtual = null;


    document.getElementById("site")
        .classList.add("escondido");


    document.getElementById("login")
        .classList.remove("escondido");

}


/* =========================
   VOLTAR PARA CENTRAL
========================= */

function voltarCentral(){

    window.location.href =
        "index.html";

}

</script>

</body>
</html>
